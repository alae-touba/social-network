# Development-only database. The full stack (API + Postgres + Adminer) lives
# in docker-compose.yaml; this file exists so you can develop locally against
# just a database: `npm run db:start`.
name: social-network-dev

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - "${POSTGRES_HOST_PORT:-5433}:5432"
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-social_network_db}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-social_network_db}"]
            interval: 5s
            timeout: 5s
            retries: 12

volumes:
    pgdata:
