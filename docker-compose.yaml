services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-social_network_db}?schema=public
            - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
        restart: unless-stopped
        ports:
            - "${APP_PORT:-3000}:3000"
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - "${POSTGRES_HOST_PORT:-5433}:5432"
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-social_network_db}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-social_network_db}"]
            interval: 5s
            timeout: 5s
            retries: 12

    adminer:
        image: adminer:latest
        restart: unless-stopped
        ports:
            - "${ADMINER_PORT:-8082}:8080"
        environment:
            - ADMINER_DEFAULT_SERVER=postgres
        depends_on:
            - postgres

volumes:
    pgdata:
