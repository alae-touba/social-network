services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-social_network_db}
            - DB_USERNAME=postgres
            - DB_PASSWORD=${POSTGRES_PASSWORD:-secret}
            - JWT_SECRET=${JWT_SECRET:-change-me-in-production-0123456789abcdef}
        restart: unless-stopped
        ports:
            - "${APP_PORT:-3000}:3000"
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - "${POSTGRES_HOST_PORT:-5433}:5432"
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-social_network_db}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-social_network_db}"]
            interval: 5s
            timeout: 5s
            retries: 12

    adminer:
        image: adminer:latest
        restart: unless-stopped
        ports:
            - "${ADMINER_PORT:-8082}:8080"
        environment:
            - ADMINER_DEFAULT_SERVER=postgres
        depends_on:
            - postgres

volumes:
    pgdata:
